name: Set up the backend
description: >
  Python, the backend's dependencies in backend/.venv (where the Makefile and
  the Playwright fixtures expect them), the embedding model, and a database
  migrated from empty and seeded with the catalog and the synthetic corpus.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements*.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m venv backend/.venv
        # CPU-only torch first: the default Linux wheel pulls gigabytes of CUDA.
        backend/.venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
        backend/.venv/bin/pip install -r backend/requirements-dev.txt

    - name: Cache the embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-all-MiniLM-L6-v2

    - name: Migrate from an empty database and seed
      shell: bash
      run: |
        cd backend && .venv/bin/alembic upgrade head && cd ..
        PYTHONPATH=backend backend/.venv/bin/python backend/scripts/seed_catalog.py
        PYTHONPATH=backend backend/.venv/bin/python -m synthetic.generate
